name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: vet, staticcheck, test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ['1.22']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: go vet
        run: go vet ./...

      - name: install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@2024.1.1

      - name: staticcheck
        run: staticcheck ./...

      - name: go test
        run: go test -race -count=1 ./...

  build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w" -o "dist/scorpius-${GOOS}-${GOARCH}" ./cmd/scorpius

      - name: artifact
        uses: actions/upload-artifact@v4
        with:
          name: scorpius-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/scorpius-${{ matrix.goos }}-${{ matrix.goarch }}
          retention-days: 14
          if-no-files-found: error
