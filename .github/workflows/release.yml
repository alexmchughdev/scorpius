name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: build, sign, publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff  # v5
        with:
          go-version: '1.22'
          cache: true

      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac  # v3

      - name: build binaries
        env:
          CGO_ENABLED: '0'
          GOOS: linux
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            GOARCH="${arch}" go build \
              -trimpath \
              -ldflags="-s -w -X main.version=${GITHUB_REF_NAME}" \
              -o "dist/scorpius-linux-${arch}" \
              ./cmd/scorpius
          done

      - name: generate SBOM (CycloneDX)
        uses: CycloneDX/gh-gomod-generate-sbom@efc74245d6802c8cefd925620515442756c70d8f  # v2
        with:
          version: v1
          args: mod -licenses -json -output dist/sbom.cyclonedx.json

      - name: generate checksums
        working-directory: dist
        run: sha256sum scorpius-linux-* sbom.cyclonedx.json > checksums.txt

      - name: sign checksums (cosign keyless via OIDC)
        working-directory: dist
        run: |
          cosign sign-blob --yes \
            --output-signature checksums.txt.sig \
            --output-certificate checksums.txt.pem \
            checksums.txt

      - name: create GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          files: |
            dist/scorpius-linux-amd64
            dist/scorpius-linux-arm64
            dist/sbom.cyclonedx.json
            dist/checksums.txt
            dist/checksums.txt.sig
            dist/checksums.txt.pem
          generate_release_notes: true
          fail_on_unmatched_files: true
