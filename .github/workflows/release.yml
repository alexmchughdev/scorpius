name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: build, sign, publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - uses: sigstore/cosign-installer@v3

      - name: build binaries
        env:
          CGO_ENABLED: '0'
          GOOS: linux
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            GOARCH="${arch}" go build \
              -trimpath \
              -ldflags="-s -w -X main.version=${GITHUB_REF_NAME}" \
              -o "dist/scorpius-linux-${arch}" \
              ./cmd/scorpius
          done

      - name: generate checksums
        working-directory: dist
        run: sha256sum scorpius-linux-* > checksums.txt

      - name: sign checksums (cosign keyless via OIDC)
        working-directory: dist
        run: |
          cosign sign-blob --yes \
            --output-signature checksums.txt.sig \
            --output-certificate checksums.txt.pem \
            checksums.txt

      - name: create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/scorpius-linux-amd64
            dist/scorpius-linux-arm64
            dist/checksums.txt
            dist/checksums.txt.sig
            dist/checksums.txt.pem
          generate_release_notes: true
          fail_on_unmatched_files: true
